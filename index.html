<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FrameBank</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
<style>
:root{--bg:#0e0e0d;--panel:#171716;--panel2:#22201d;--line:#302d29;--text:#f4efe8;--muted:#aaa198;--accent:#e7c28d;--danger:#f08f83}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(14,14,13,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{max-width:1500px;margin:auto;padding:14px 18px;display:flex;gap:12px;align-items:center}
.brand{font-size:22px;font-weight:850;white-space:nowrap}.brand b{color:var(--accent)}
.search{flex:1}input,select,textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:#20180f;border-color:transparent;font-weight:800} .btn.danger{color:var(--danger)}
main{max-width:1500px;margin:auto;padding:16px 18px 70px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 10px;border-radius:999px;cursor:pointer}.chip.on{background:var(--panel2);color:var(--text)}.count{margin-left:auto;color:var(--muted);font-size:12px;padding:8px}
.grid{columns:5 245px;column-gap:14px}.card{break-inside:avoid;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;position:relative}.card img{width:100%;display:block}.meta{padding:11px 12px}.film{font-size:14px;font-weight:800}.desc{font-size:13px;line-height:1.35;margin-top:4px}.cat{display:inline-block;margin-top:8px;color:var(--muted);font-size:11px;border:1px solid var(--line);padding:3px 7px;border-radius:999px}.card-actions{position:absolute;right:7px;top:7px;display:flex;gap:5px}.mini{width:34px;height:34px;border-radius:9px;background:rgba(0,0,0,.72);color:white;border:1px solid rgba(255,255,255,.15)}
.fab{position:fixed;right:20px;bottom:24px;z-index:15;width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:#20180f;font-size:32px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}.modal.open{display:flex}.sheet{width:min(920px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.sheet h2{margin:0 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.editor-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}.canvasbox{min-height:420px;background:#090909;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px}#editImg{max-width:100%;display:block}.tools{display:flex;flex-direction:column;gap:10px}.toolrow{display:grid;grid-template-columns:1fr 1fr;gap:7px}input[type=range]{padding:0}.status{font-size:12px;color:var(--muted);margin-left:auto}
.auth{display:flex;gap:8px;align-items:center}.auth input{max-width:220px}.hidden{display:none!important}
@media(max-width:800px){.grid{columns:2 150px}.top{flex-wrap:wrap}.brand{width:100%}.editor-wrap{grid-template-columns:1fr}.canvasbox{min-height:320px}.form{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:450px){.grid{columns:1}.top{padding:12px}.auth{width:100%}.auth input{max-width:none}}
</style>
</head>
<body>
<header><div class="top">
<div class="brand">FRAME<b>BANK</b></div>
<div class="search"><input id="q" placeholder="Search film, description or category…"></div>
<div class="auth" id="authBox"><input id="email" type="email" placeholder="Email to sync"><button class="btn" id="loginBtn">Sign in</button></div>
<button class="btn hidden" id="logoutBtn">Sign out</button>
</div></header>
<main><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main>
<button class="fab" id="addBtn" title="Add frame">+</button>
<input type="file" id="fileInput" accept="image/*" hidden>

<div class="modal" id="editModal"><div class="sheet">
<h2>Edit image</h2>
<div class="editor-wrap">
<div class="canvasbox"><img id="editImg"></div>
<div class="tools">
<div class="toolrow"><button class="btn" id="rotateL">↶ Rotate</button><button class="btn" id="rotateR">Rotate ↷</button></div>
<div class="toolrow"><button class="btn" id="flipH">↔ Flip</button><button class="btn" id="resetCrop">Reset</button></div>
<label>Brightness <span id="brightVal">100</span>%</label><input id="brightness" type="range" min="50" max="150" value="100">
<label>Contrast <span id="contrastVal">100</span>%</label><input id="contrast" type="range" min="50" max="150" value="100">
<label>Saturation <span id="satVal">100</span>%</label><input id="saturation" type="range" min="0" max="180" value="100">
<div class="footer"><button class="btn" id="cancelEdit">Cancel</button><button class="btn primary" id="useEdit">Use image</button></div>
</div></div>
</div></div>

<div class="modal" id="metaModal"><div class="sheet">
<h2 id="metaHeading">Add frame</h2>
<div class="form">
<div class="full"><label>Film</label><input id="film"></div>
<div class="full"><label>Your shot description</label><textarea id="description" rows="3"></textarea></div>
<div class="full"><label>Category</label><select id="category"><option>Framing</option><option>Lighting</option><option>Colour</option><option>Production Design</option><option>Wardrobe</option><option>Portraits</option><option>Reflections</option><option>Paparazzi / Reactive</option><option>Locations</option><option>Camera Movement</option><option>Composition / Blocking</option><option>Texture / Graphics</option><option>Atmosphere / Landscape</option><option>Other</option></select></div>
</div>
<div class="footer"><button class="btn" id="cancelMeta">Cancel</button><button class="btn primary" id="saveMeta">Save</button></div>
</div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>

["Composition / Blocking",["blocking","separation","alienation","group","walk and talk","story unfolding"]]
];for(const [c,ks] of rules)if(ks.some(k=>d.includes(k)))return c;return "Other"}

function drawFilters(){$("#filters").innerHTML=cats.map(c=>`<button class="chip ${c===active?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")+`<span class="count" id="count"></span>`;document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{active=b.dataset.c;drawFilters();draw()})}
async function signedURL(path){if(!supa)return "";const {data,error}=await supa.storage.from("frames").createSignedUrl(path,3600);return error?"":data.signedUrl}
async function draw(){
 let q=$("#q").value.toLowerCase().trim();
 let base=starter.map(x=>({...x,url:x.file,synced:false}));
 let synced=[];
 for(const x of syncItems) synced.push({...x,url:await signedURL(x.image_path),synced:true});
 let arr=[...synced,...base].filter(x=>(active==="All"||x.category===active)&&(!q||[x.film,x.description,x.category].join(" ").toLowerCase().includes(q)));
 $("#count").textContent=arr.length+" frames";
 $("#grid").innerHTML=arr.map(x=>`<article class="card"><img loading="lazy" src="${x.url}"><div class="card-actions">${x.synced?`<button class="mini editmeta" data-id="${x.id}">✎</button><button class="mini delete" data-id="${x.id}">×</button>`:""}</div><div class="meta"><div class="film">${esc(x.film)}</div><div class="desc">${esc(x.description)}</div><span class="cat">${esc(x.category)}</span></div></article>`).join("");
 document.querySelectorAll(".editmeta").forEach(b=>b.onclick=()=>openMetaForEdit(b.dataset.id));
 document.querySelectorAll(".delete").forEach(b=>b.onclick=()=>deleteFrame(b.dataset.id));
}
async function loadSync(){if(!supa||!session){syncItems=[];return draw()}const {data,error}=await supa.from("frames").select("*").order("created_at",{ascending:false});syncItems=error?[]:data;draw()}
async function updateAuthUI(){$("#authBox").classList.toggle("hidden",!!session);$("#logoutBtn").classList.toggle("hidden",!session)}

$("#q").oninput=draw;
$("#loginBtn").onclick=async()=>{if(!configured)return alert("FrameBank sync has not been configured yet.");const email=$("#email").value.trim();if(!email)return;const {error}=await supa.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});alert(error?error.message:"Check your email for the FrameBank sign-in link.")};
$("#logoutBtn").onclick=async()=>{await supa.auth.signOut()};
if(supa){supa.auth.getSession().then(r=>{session=r.data.session;updateAuthUI();loadSync()});supa.auth.onAuthStateChange((_e,s)=>{session=s;updateAuthUI();loadSync()})}else{updateAuthUI();draw()}

$("#addBtn").onclick=async()=>{
  if(!configured)return alert("FrameBank sync has not been configured yet.");

  const {data,error}=await supa.auth.getSession();

  if(error || !data.session){
    return alert("Sign in first so new frames sync across your devices.");
  }

  session=data.session;
  $("#fileInput").click();
};
$("#fileInput").onchange=e=>{const f=e.target.files[0];if(!f)return;workingBlob=f;openEditor(f)};

function openEditor(blob){const url=URL.createObjectURL(blob);$("#editImg").src=url;$("#editModal").classList.add("open");$("#brightness").value=$("#contrast").value=$("#saturation").value=100;flipX=1;$("#editImg").onload=()=>{if(cropper)cropper.destroy();cropper=new Cropper($("#editImg"),{viewMode:1,autoCropArea:1,background:false,responsive:true})}}
function setVal(id,label){$ (label).textContent=$(id).value; applyPreviewFilter()}
function applyPreviewFilter(){$("#editImg").style.filter=`brightness(${$("#brightness").value}%) contrast(${$("#contrast").value}%) saturate(${$("#saturation").value}%)`}
$("#brightness").oninput=()=>{$("#brightVal").textContent=$("#brightness").value;applyPreviewFilter()};
$("#contrast").oninput=()=>{$("#contrastVal").textContent=$("#contrast").value;applyPreviewFilter()};
$("#saturation").oninput=()=>{$("#satVal").textContent=$("#saturation").value;applyPreviewFilter()};
$("#rotateL").onclick=()=>cropper&&cropper.rotate(-90);$("#rotateR").onclick=()=>cropper&&cropper.rotate(90);
$("#flipH").onclick=()=>{flipX*=-1;cropper&&cropper.scaleX(flipX)};$("#resetCrop").onclick=()=>cropper&&cropper.reset();
$("#cancelEdit").onclick=()=>{$("#editModal").classList.remove("open");if(cropper)cropper.destroy();cropper=null};
$("#useEdit").onclick=()=>{if(!cropper)return;const c=cropper.getCroppedCanvas({maxWidth:1800,maxHeight:1800,imageSmoothingQuality:"high"});const o=document.createElement("canvas");o.width=c.width;o.height=c.height;const ctx=o.getContext("2d");ctx.filter=`brightness(${$("#brightness").value}%) contrast(${$("#contrast").value}%) saturate(${$("#saturation").value}%)`;ctx.drawImage(c,0,0);o.toBlob(b=>{workingBlob=b;$("#editModal").classList.remove("open");cropper.destroy();cropper=null;editingRecord=null;$("#metaHeading").textContent="Add frame";$("#film").value="";$("#description").value="";$("#category").value="Other";$("#metaModal").classList.add("open")},"image/jpeg",0.86)};

$("#cancelMeta").onclick=()=>$("#metaModal").classList.remove("open");
function openMetaForEdit(id){const x=syncItems.find(a=>a.id===id);if(!x)return;editingRecord=x;workingBlob=null;$("#metaHeading").textContent="Edit frame details";$("#film").value=x.film||"";$("#description").value=x.description||"";$("#category").value=x.category||"Other";$("#metaModal").classList.add("open")}
$("#description").onblur=()=>{if($("#category").value==="Other")$("#category").value=smartCategory($("#description").value)};
$("#saveMeta").onclick=async()=>{if(!session)return;const film=$("#film").value.trim();const description=$("#description").value.trim();const category=$("#category").value;if(!film)return alert("Add the film name.");
 if(editingRecord){const {error}=await supa.from("frames").update({film,description,category}).eq("id",editingRecord.id);if(error)return alert(error.message);editingRecord=null;$("#metaModal").classList.remove("open");return loadSync()}
 if(!workingBlob)return;
 const path=`${session.user.id}/${crypto.randomUUID()}.jpg`;let r=await supa.storage.from("frames").upload(path,workingBlob,{contentType:"image/jpeg",upsert:false});if(r.error)return alert(r.error.message);
 const ins=await supa.from("frames").insert({film,description,category,image_path:path});if(ins.error){await supa.storage.from("frames").remove([path]);return alert(ins.error.message)}workingBlob=null;$("#metaModal").classList.remove("open");$("#fileInput").value="";loadSync()};
async function deleteFrame(id){const x=syncItems.find(a=>a.id===id);if(!x||!confirm("Delete this frame?"))return;const r=await supa.from("frames").delete().eq("id",id);if(r.error)return alert(r.error.message);await supa.storage.from("frames").remove([x.image_path]);loadSync()}
drawFilters();
</script>
</body></html>
